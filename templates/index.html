<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Workout Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🏋️‍♂️ Personalized Workout Generator</h1>
        
        <!-- ✅ SECURITY: Display validation errors if any -->
        {% if errors %}
        <div class="error-box">
            <h3>⚠️ Please fix the following issues:</h3>
            <ul>
            {% for error in errors %}
                <li>{{ error }}</li>
            {% endfor %}
            </ul>
        </div>
        {% endif %}
        
        <form action="/generate" method="POST" id="workoutForm">
            <!-- ✅ SECURITY: CSRF Token (required for Flask-WTF) -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            
            <label for="goal">💡 Fitness Goal:</label>
            <select name="goal" required>
                <option value="">-- Select --</option>
                <option value="fat loss">Fat Loss</option>
                <option value="muscle gain">Muscle Gain</option>
                <option value="endurance">Endurance</option>
                <option value="general fitness">General Fitness</option>
            </select>

            <label for="time">⏱️ Workout Duration (minutes):</label>
            <input type="number" name="time" min="5" max="180" required placeholder="e.g., 30">

            <label for="weight">⚖️ Weight (in kg):</label>
            <input type="number" name="weight" min="20" max="300" step="0.1" required placeholder="e.g., 75">

            <label for="height">📏 Height (in cm):</label>
            <input type="number" name="height" min="100" max="250" required placeholder="e.g., 180">

            <label for="age">Age:</label>
            <input type="number" name="age" min="13" max="120" required placeholder="e.g., 30">

            <label for="gender">🚻 Gender:</label>
            <select name="gender" required>
                <option value="">-- Select --</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>

            <label for="level">📊 Fitness Level:</label>
            <select name="level" required>
                <option value="">-- Select --</option>
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
            </select>

             <label for="equipment">🏋️ Equipment (optional):</label>
            <input type="text" name="equipment" placeholder="e.g., Dumbbells, Resistance Bands" maxlength="100">

            <button type="submit" id="submitBtn">🔥 Generate Plan</button>
        </form>
        
        <!-- Loading Spinner -->
        <div id="loader" class="loader" style="display: none;">
            <div class="spinner"></div>
            <p>Generating your personalized workout plan...</p>
        </div>
    </div>
    
    <footer class="app-footer">
        <p>© 2025 YS Company, a subsidiary of VISION GROUP. All rights reserved.</p>
    </footer>
    
    <script>
        document.getElementById('workoutForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const loaderElement = document.getElementById('loader');
            const submitBtn = document.getElementById('submitBtn');
            const formElement = document.getElementById('workoutForm');
            
            loaderElement.style.display = 'flex';
            submitBtn.disabled = true;
            
            // Submit the form after showing the loader
            setTimeout(() => {
                formElement.submit();
            }, 100);
        });
    </script>
</body>
</html>
