<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Workout Plan</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>
  <div id="success" class="fade-in">
    <svg width="80" height="80" viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="22" stroke="#4caf50" stroke-width="4" fill="none"/>
      <path d="M14 24l6 6 14-14" stroke="#4caf50" stroke-width="4" fill="none"/>
    </svg>
    <h2 style="color: white;">Plan Ready!</h2>
  </div>

  <h1>🔥 Your Personalized Workout Plan</h1>
  
  <div class="workout-box">
    {{ workout | safe }}

    {% if videos %}
  <div class="video-section">
    <h2>🎥 Exercise Demo Videos</h2> 
    <div class="video-grid">
      {% for title, video_url in videos %}
        <div class="video-card">
          <iframe 
            src="{{ video_url }}"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
          </iframe>
          <h4>{{ title }}</h4>
        </div>
      {% endfor %}
    </div>
  </div>
{% endif %}




  </div>
  <form id="pdfForm" action="{{ url_for('download_pdf') }}" method="post" style="text-align:center; margin-top:20px;">
    {{ csrf_token() }}
    <input type="hidden" name="workout_html" value="{{ workout|tojson|safe }}">
    <button type="submit" style="padding:12px 20px; font-size:16px; background:#673ab7; color:white; border:none; border-radius:8px; cursor:pointer;">
      📄 Download Workout Plan as PDF
    </button>
  </form>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    <!-- Server-side PDF download handled by Flask endpoint; client-side PDF script removed -->
  </script>
  
  <footer class="app-footer">
    <p>© 2025 YS Company, a subsidiary of VISION GROUP. All rights reserved.</p>
  </footer>
</body>

</html>
